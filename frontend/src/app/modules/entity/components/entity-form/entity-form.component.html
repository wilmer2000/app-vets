<div  class="flex flex-col w-full gap-12 lg:flex-row">
  <div [formGroup]="form()">
    <h5 class="mb-4">Datos de la entidad</h5>
    <div class="grid grid-cols-12 gap-4">
      <app-form-switch
        (statusEmitter)="changeIsActive($event)"
        [label]="'Entidad activo'"
        [status]="isActiveControl.value"
        class="col-span-12"
      />
    </div>
  </div>
  <div class="flex flex-col w-full gap-12">
    <div [formGroup]="addressFormGroup">
      <h5 class="mb-4">Dirección</h5>
      <div class="grid grid-cols-12 gap-4">
        <app-form-control
          [controlName]="'street'"
          [form]="addressFormGroup"
          [label]="'Calle'"
          class="col-span-12 md:col-span-4 lg:col-span-6"
        />
        <app-form-control
          [controlName]="'city'"
          [form]="addressFormGroup"
          [label]="'Ciudad'"
          class="col-span-12 md:col-span-4 lg:col-span-6"
        />
        <app-form-control
          [controlName]="'country'"
          [form]="addressFormGroup"
          [label]="'Pais'"
          class="col-span-12 md:col-span-4 lg:col-span-6"
        />
      </div>
    </div>
    <div [formGroup]="contactFormGroup">
      <h5 class="mb-4">Contacto</h5>
      <div class="grid grid-cols-12 gap-4">
        <app-form-control
          [controlName]="'phone'"
          [form]="contactFormGroup"
          [label]="'Teléfono'"
          class="col-span-12 md:col-span-4 lg:col-span-6"
        />
        <app-form-control
          [controlName]="'email'"
          [form]="contactFormGroup"
          [label]="'Email secundario'"
          [type]="'email'"
          class="col-span-12 md:col-span-4 lg:col-span-6"
        />
      </div>
    </div>
  </div>
</div>
